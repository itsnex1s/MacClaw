[package]
name = "macclaw"
version = "0.2.0"
description = "Raycast-style macOS client for OpenClaw"
license = "MIT"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.8"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
dirs = "6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "objc2-core-foundation"] }
objc2-foundation = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3"
sha2 = "0.11"
base64 = "0.23"
security-framework = "3"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
